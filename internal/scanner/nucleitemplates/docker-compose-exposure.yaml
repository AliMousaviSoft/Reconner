id: reconner-docker-compose-exposure
info:
  name: Exposed docker-compose.yml
  author: reconner
  severity: medium
  description: A readable docker-compose file often leaks service credentials, environment variables and internal architecture.
  tags: reconner,exposure,docker,config
http:
  - method: GET
    path:
      - "{{BaseURL}}/docker-compose.yml"
      - "{{BaseURL}}/docker-compose.yaml"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      # Anchored to real YAML structure (top-level "services:" key, a nested
      # "image:" directive under a service entry) rather than a bare word
      # match — "services:" and "image:" alone are common enough in
      # unrelated JSON/YAML API responses (a "services" listing, a product
      # "image" field) to false-positive on non-Compose content.
      - type: regex
        part: body
        regex:
          - "(?m)^services:\\s*$"
          - "(?m)^\\s+image:\\s*\\S+"
        condition: and
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/html"
          - "application/json"
        negative: true

id: reconner-wp-ai1wm-backup-listing
info:
  name: WordPress All-in-One WP Migration backup directory listing
  author: reconner
  severity: high
  description: The All-in-One WP Migration backup directory is browsable, exposing .wpress full-site archives (database + credentials) for direct download. Confirmed by a genuine autoindex listing.
  tags: reconner,wordpress,all-in-one-wp-migration,backup,exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/ai1wm-backups/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of"
          - "ai1wm-backups"
        condition: and
      - type: status
        status:
          - 200

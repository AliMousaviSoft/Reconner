id: reconner-wp-xmlrpc-multicall
info:
  name: WordPress XML-RPC brute-force amplification (system.multicall)
  author: reconner
  severity: medium
  description: xmlrpc.php advertises system.multicall, which batches hundreds of login attempts into a single request and bypasses per-request login throttling; pingback.ping additionally enables SSRF/DDoS reflection. Confirmed from the server's own system.listMethods response.
  tags: reconner,wordpress,xmlrpc,bruteforce,amplification
http:
  - raw:
      - |
        POST /xmlrpc.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml

        <?xml version="1.0"?><methodCall><methodName>system.listMethods</methodName><params></params></methodCall>
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<methodResponse"
          - "system.multicall"
        condition: and
      - type: status
        status:
          - 200

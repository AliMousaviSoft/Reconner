id: reconner-htpasswd-exposed
info:
  name: Apache .htpasswd file exposed
  author: reconner
  severity: high
  description: A readable .htpasswd discloses usernames and password hashes (bcrypt/apr1/MD5) that can be cracked offline for authenticated access.
  tags: reconner,exposure,htpasswd,credentials,misconfig
http:
  - method: GET
    path:
      - "{{BaseURL}}/.htpasswd"
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "^[a-zA-Z0-9._-]+:(\\$(apr1|2y|2a|1)\\$|\\{SHA\\})"
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/html"
        negative: true
